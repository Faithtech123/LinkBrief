services:
  - type: web
    name: linkbrief-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /?action=health
    envVars:
      - key: DB_PORT
        value: "3306"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: linkbrief
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
